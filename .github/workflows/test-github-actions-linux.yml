name: Test Github ACtions Linux

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    # Pico SDK, Arm and RISC-V GCC, picotool and ccache. They come from the
    # cache unless their versions (set in the action) have changed.
    - name: Set up Pico tools
      uses: ./.github/actions/setup-pico-tools

    # One build directory per chip. ccache reuses objects compiled in earlier runs.
    - name: Build RP2040 firmware
      run: |
        echo "Build machine has $(nproc) cores."
        cmake -S . -B build/rp2040 -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=pico -DPICO_SDK_PATH=$PICO_SDK_PATH
        cmake --build build/rp2040 --parallel $(nproc)

    - name: Build RP2350 (Arm) firmware
      run: |
        cmake -S . -B build/rp2350 -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=pico2 -DPICO_SDK_PATH=$PICO_SDK_PATH
        cmake --build build/rp2350 --parallel $(nproc)

    - name: Build RP2350 (RISC-V) firmware
      run: |
        cmake -S . -B build/rp2350-riscv -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=pico2 -DPICO_PLATFORM=rp2350-riscv -DPICO_SDK_PATH=$PICO_SDK_PATH
        cmake --build build/rp2350-riscv --parallel $(nproc)

    - name: Check that the release files exist
      run: |
        for f in build/rp2040/Coremark-RP2040.uf2 \
                 build/rp2350/Coremark-RP2350.uf2 \
                 build/rp2350-riscv/Coremark-RP2350-RISCV.uf2; do
          if [ -f "$f" ]; then
            echo "$f exists."
          else
            echo "$f is missing."
            exit 1
          fi
        done

    - name: Show ccache statistics
      run: ccache --show-stats

